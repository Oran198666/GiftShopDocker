# all images and containers
services:

  # mysql container
  mysql-service:

  #mysql image:
    image: mysql:8.4.11

  # container name
    container_name: mysql-container

  # restart policy
    restart: unless-stopped

  #volumes
    volumes:
      - mysql-volume:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d:ro

  # Environment variables
    environment:
      MYSQL_ROOT_PASSWORD: Pa$$w0rd
      MYSQL_DATABASE: giftshop



#---------------------------------------------
# backend service
  backend-service:

    #image
    image: giftshop-backend

    #image building from the docker file location
    build: ./Backend

    #container name
    container_name: giftshop-backend

    # ports mapping:
    ports:
      - 4000:4000

    # restart policy
    restart: unless-stopped

    # Wait for the databases to start:
    depends_on:
      - mysql-service

  # Environment variables
    environment:
      ENVIRONMENT: development
      MYSQL_HOST: mysql-service
      MYSQL_USER: root
      MYSQL_PASSWORD: Pa$$w0rd
      MYSQL_DATABASE: giftshop
      JWT_SECRET: "We are going to rule the world!"
      HASH_SALT: "The-Amazing-45800-7-Students!"
      RECAPTCHA_SECRET_KEY: "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
#---------------------------------------------
# frontend service
  frontend-service:

    #image
    image: giftshop-frontend

    #image building from the docker file location
    build: ./Frontend

    #container name
    container_name: giftshop-frontend

    # ports mapping:
    ports:
      - 5173:5173

    # restart policy
    restart: unless-stopped



#---------------------------------------------

volumes:
  mysql-volume: